[project]
name = "software-factory"
version = "0.1.0"
description = "Strands-based harness for the software factory"
requires-python = ">=3.12"
dependencies = [
  "strands-agents[gemini,otel]>=1.61",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
