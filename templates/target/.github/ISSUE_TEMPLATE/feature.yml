name: Feature or enhancement
description: A change to what the product does
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intent
      description: What is missing or wrong today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkable statement per line, written so an agent can verify it with a test or a command.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: "high = touches the risk areas listed in factory.yml, adds a paid service or external dependency, or changes deploy/CI config."
      options:
        - low
        - high
    validations:
      required: true
  - type: input
    id: amigos
    attributes:
      label: Three amigos for this work
      description: Who holds product (intent), development (direction) and testing (coherence) for this issue, if not the defaults in factory.yml. Name anyone wearing two hats.
      placeholder: "product @a · development @b · testing @a (two hats: @a)"
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope and dependencies
      description: What must not change. Use `Depends on #N` for prerequisites.
