name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: validate target profiles
        run: |
          mkdir -p "$RUNNER_TEMP/profiles"
          for f in templates/target/factory.yml examples/fantasy-football/factory.yml; do
            yq -o=json '.' "$f" >"$RUNNER_TEMP/profiles/profile.json"
            uv run --frozen python -m factory.schemas validate-profile --file "$RUNNER_TEMP/profiles/profile.json"
          done

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh
      - name: config sync
        run: scripts/check-config-sync.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: prompt lint
        run: |
          fail=0
          while IFS= read -r f; do
            if [ ! -s "$f" ]; then echo "::error file=$f::prompt is empty"; fail=1; continue; fi
            if ! grep -qi proposal "$f"; then echo "::error file=$f::prompt does not mention 'proposal'"; fail=1; fi
          done < <(find agents -type f -name '*.md' | sort)
          # every agent prompt carries the rendered target profile exactly once
          while IFS= read -r f; do
            n="$(grep -o '{{target_profile}}' "$f" | wc -l)"
            if [ "$n" -ne 1 ]; then echo "::error file=$f::prompt must contain {{target_profile}} exactly once (found $n)"; fail=1; fi
          done < <(find agents -mindepth 2 -type f -name '*.md' ! -name README.md ! -path 'agents/_shared/*' | sort)
          exit "$fail"

  # Deploys the control-plane Worker on every push to main once its tests and lint pass.
  # Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit) and CLOUDFLARE_ACCOUNT_ID;
  # until they exist the job logs a warning and does nothing.
  deploy-control-plane:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [control-plane, lint]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-control-plane
      cancel-in-progress: false
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Check Cloudflare secrets
        id: check
        env:
          HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping control-plane deploy"
          fi
          echo "ready=$HAS_SECRETS" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24
      - run: npm ci
        if: steps.check.outputs.ready == 'true'
      - name: Apply D1 migrations (remote)
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply factory --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: control-plane
          command: deploy
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
